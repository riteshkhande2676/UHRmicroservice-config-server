server:
  port: 8080

eureka:
  Client:
    fetch-registry: true
    register-with-eureka: true


spring:
  application:
    name: Api-Gateway

  cloud:
    gateway:
      server:
        web flux:
          routes:
            - id: User-Service
              uri: lb://User-Service
              predicates:
                - Path=/user/**

            - id: Hotel-Service
              uri: lb://Hotel-Service
              predicates:
                - Path=/hotel/**

            - id: Rating-Service
              uri: lb://Rating-Service
              predicates:
                - Path=/rating/**
