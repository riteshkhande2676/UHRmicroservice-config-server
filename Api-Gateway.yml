server:
  port: 8088

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        web flux:
          routes:
            - id: User-Service
              uri: lb://User-Service
              predicates:
                - Path=/user/**

            - id: Hotel-Service
              uri: lb://Hotel-Service
              predicates:
                - Path=/hotel/**

            - id: Rating-Service
              uri: lb://Rating-Service
              predicates:
                - Path=/rating/**
